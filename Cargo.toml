[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The pinned toolchain is also the minimum supported version.
rust-version = "1.98"
# The project has no licence, so nothing is published.
publish = false

[workspace.dependencies]
teta-wot = { path = "crates/teta-wot" }
teta-wot-core = { path = "crates/teta-wot-core" }
teta-wot-http = { path = "crates/teta-wot-http" }
teta-wot-macros = { path = "crates/teta-wot-macros" }
teta-wot-server = { path = "crates/teta-wot-server" }
teta-wot-td = { path = "crates/teta-wot-td" }

anyhow = "1.0"
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio", "ws"] }
bytes = "1.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6", features = ["derive"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
http = "1.5"
http-body-util = "0.1.5"
indexmap = { version = "2.14", features = ["serde"] }
insta = { version = "1.48", features = ["json"] }
jpeg-encoder = "0.7.1"
jsonschema = { version = "0.58", default-features = false }
mdns-sd = { version = "0.21.4", default-features = false }
ndarray = { version = "0.17.2", default-features = false, features = ["std"] }
proc-macro2 = "1.0.107"
proptest = "1.11"
quote = "1.0.47"
regex = "1.11"
schemars = { version = "1.2", features = ["preserve_order", "indexmap2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_path_to_error = "0.1.20"
syn = { version = "2.0.119", features = ["full"] }
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["std", "registry", "fmt", "ansi", "env-filter"] }
trybuild = "1.0.119"
uuid = { version = "1.18", features = ["v4", "v5", "serde"] }
windows-service = "0.8"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package]
# Snapshot diffs are much faster with an optimised `similar`.
insta.opt-level = 3
similar.opt-level = 3
