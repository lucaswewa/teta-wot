[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
teta-wot-td = { path = "crates/teta-wot-td" }
teta-wot-core = { path = "crates/teta-wot-core" }
teta-wot-http = { path = "crates/teta-wot-http" }
teta-wot-server = { path = "crates/teta-wot-server" }
teta-wot = { path = "crates/teta-wot" }

anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
regex = "1.13"
indexmap = { version = "2.14.2", features = ["serde"] }
jsonschema = { version = "0.58.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
schemars = { version = "1.2", features = ["preserve_order", "indexmap2"] }
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
insta = { version = "1.48", features = ["json"] }
thiserror = "2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "fmt", "ansi", "env-filter"] }
uuid = { version = "1.26", features = ["v4", "v5", "serde"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
http = "1.5"
http-body-util = "0.1.5"
bytes = "1.12"
tower = { version = "0.5.3", features = ["util"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
