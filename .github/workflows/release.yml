name: Release

# Pushing a tag vX.Y.Z publishes a release: the source, a Windows
# x86_64 package with the simulated microscope's binaries and every licence
# notice, and checksums. Tag only after the checklist in docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: The tag, the version and the changelog agree
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::the tag ${GITHUB_REF_NAME} isn't v${version}, the workspace version"
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          awk -v v="## [${version}]" 'index($0, v) == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md > release-notes.md
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Build the binaries
        run: cargo build --release --locked -p simulated-microscope -p microscope-service
      - name: Package
        shell: bash
        run: |
          version=${{ steps.version.outputs.version }}
          name="teta-wot-${version}-windows-x86_64"
          mkdir -p "dist/${name}"
          cp target/release/simulated-microscope.exe target/release/microscope-service.exe "dist/${name}/"
          cp examples/simulated-microscope/microscope.json examples/simulated-microscope/demo.py "dist/${name}/"
          cp CHANGELOG.md "dist/${name}/"
          sed "s/{version}/${version}/" tools/release/README.txt > "dist/${name}/README.txt"
          (cd dist && 7z a -tzip "${name}.zip" "${name}" > /dev/null && rm -r "${name}")
          git archive --format=zip --prefix="teta-wot-${version}/" -o "dist/teta-wot-${version}-source.zip" "${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="teta-wot-${version}/" -o "dist/teta-wot-${version}-source.tar.gz" "${GITHUB_REF_NAME}"
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "teta-wot ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md
