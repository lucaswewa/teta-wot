name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The supported platforms: Windows and Linux (Ubuntu), on x86_64. Every job
# runs on both, and one failing doesn't cancel the other.
jobs:
  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
          - name: Ubuntu 24.04 x86_64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Documentation
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # The workspace build turns `docs-offline` on (an example needs it), so
      # the online docs pages are tested with packages built on their own.
      - name: Docs pages with Swagger UI and ReDoc from jsDelivr
        run: cargo test --locked -p teta-wot-http -p teta-wot --lib
      - name: Example smoke tests
        shell: bash
        run: |
          for example in examples/*/; do
            name=$(basename "$example")
            echo "::group::$name"
            cargo run --quiet --locked --manifest-path "$example/Cargo.toml"
            echo "::endgroup::"
          done
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: The guide
        run: mdbook build docs/guide
