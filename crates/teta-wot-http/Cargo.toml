[package]
name = "teta-wot-http"
description = "HTTP binding of teta-wot (axum)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
## Serve the Swagger UI and ReDoc assets from the binary, for labs without
## network access.
docs-offline = []

[dependencies]
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
uuid.workspace = true
teta-wot-core.workspace = true
teta-wot-td.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
teta-wot-core = { workspace = true, features = ["testing"] }
teta-wot-td = { workspace = true, features = ["validation"] }

[lints]
workspace = true
