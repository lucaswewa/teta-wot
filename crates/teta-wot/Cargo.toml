[package]
name = "teta-wot"
description = "wot-rs: expose laboratory hardware and software as W3C Web of Things Things. This is the crate that applications depend on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
## Validate Thing Descriptions against the vendored W3C TD 1.1 JSON Schema.
validation = ["teta-wot-td/validation"]
## Helpers for testing Things without a server, and an in-process HTTP test client (`wot::testing`).
testing = ["teta-wot-core/testing", "teta-wot-server/testing"]
## Serve the interactive API docs (`/docs`, `/redoc`) with their assets
## compiled in, so they work without network access.
docs-offline = ["teta-wot-server/docs-offline"]
## Advertise the server on the local network with DNS-SD over mDNS
## (`ThingServerBuilder::mdns`, W3C WoT Discovery).
mdns = ["teta-wot-server/mdns"]
## `NdArray`: `ndarray` arrays as properties and action inputs and outputs,
## carried as nested lists (`teta_wot::ndarray` re-exports the crate).
ndarray = ["teta-wot-core/ndarray", "dep:ndarray"]
## Run a server as a Windows service, and install one
## (`teta_wot::server::service`). Windows only.
windows-service = ["teta-wot-server/windows-service"]

[dependencies]
ndarray = { workspace = true, optional = true }

teta-wot-core.workspace = true
teta-wot-http.workspace = true
teta-wot-macros.workspace = true
teta-wot-server.workspace = true
teta-wot-td.workspace = true

[dev-dependencies]
anyhow.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
proptest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
tracing.workspace = true
trybuild.workspace = true
teta-wot = { path = ".", features = ["testing", "validation", "ndarray"] }
uuid.workspace = true

[lints]
workspace = true
