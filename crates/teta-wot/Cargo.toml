[package]
name = "teta-wot"
description = "teta-wot: expose laboratory hardware and software as W3C Web of Things Things. This is the crate that applications depend on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
validation = ["teta-wot-td/validation"]
## Helpers for testing Things without a server (`wot::testing`).
testing = ["teta-wot-core/testing", "teta-wot-server/testing"]

[dependencies]
teta-wot-td.workspace = true
teta-wot-core.workspace = true
teta-wot-http.workspace = true
teta-wot-server.workspace = true

[lints]
workspace = true
