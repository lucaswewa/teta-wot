[package]
name = "teta-wot-server"
description = "teta-wot server: configuration, Thing-type registry, lifecycle and CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
## An in-process test client (`teta_wot_server::testing`).
testing = ["dep:futures-util", "dep:tempfile", "dep:tokio-tungstenite"]
## Serve the Swagger UI and ReDoc assets from the binary, for labs without
## network access.
docs-offline = ["teta-wot-http/docs-offline"]

[dependencies]
axum.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util = { workspace = true, optional = true }
http.workspace = true
http-body-util.workspace = true
indexmap.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, optional = true }
tower.workspace = true
tracing.workspace = true
teta-wot-core.workspace = true
teta-wot-http.workspace = true

[dev-dependencies]
anyhow.workspace = true
schemars.workspace = true
serde.workspace = true
tempfile.workspace = true
teta-wot-core = { workspace = true, features = ["testing"] }
teta-wot-server = { path = ".", features = ["testing"] }

[lints]
workspace = true
