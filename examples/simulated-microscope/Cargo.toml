[package]
name = "simulated-microscope"
description = "Example: the capstone. A simulated stage, camera and autofocus composed with slots, with settings, MJPEG, Blobs, events and arrays, driven by a Python client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "simulated-microscope"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
http-body-util.workspace = true
jpeg-encoder.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
teta-wot = { workspace = true, features = ["ndarray", "testing"] }

[lints]
workspace = true
